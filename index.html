
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Al-Quran Bangla</title>
    
    <!-- Environment Mock -->
    <script>
      window.process = { env: { API_KEY: "" } };
    </script>

    <!-- Immediate Theme Injection -->
    <script>
      (function() {
        try {
          const settings = JSON.parse(localStorage.getItem('quran_settings'));
          if (settings && settings.isDarkMode) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- PWA & Mobile App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Al-Quran">
    <meta id="theme-meta" name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-512.png">

    <!-- Styles and Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              emerald: {
                50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 
                400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 
                800: '#065f46', 900: '#064e3b',
              },
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg-light: #f1f5f9; --bg-dark: #020617; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: var(--bg-light); transition: background-color 0.4s ease; }
        html.dark, html.dark body { background-color: var(--bg-dark); }
        body { font-family: 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; display: flex; justify-content: center; }
        #root { width: 100%; max-width: 1000px; height: 100dvh; display: flex; flex-direction: column; background-color: #f8fafc; position: relative; transition: background-color 0.4s ease; }
        .dark #root { background-color: var(--bg-dark); }
        @media (min-width: 1024px) {
            #root { height: 94dvh; margin-top: 3dvh; border-radius: 24px; border: 1px solid #e2e8f0; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); }
            .dark #root { border-color: #1e293b; }
        }
        .arabic-text { font-family: 'Amiri', serif; direction: rtl; }
        ::-webkit-scrollbar { display: none; }
        input, button { touch-action: manipulation; }
        .page-enter { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <!-- Transpiler for TSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.38.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    
    <!-- Using Babel to transpile index.tsx on the fly -->
    <script type="text/babel" data-type="module" src="./index.tsx"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
