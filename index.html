<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Al-Quran Bangla</title>
    
    <!-- Global Error Handler -->
    <script>
      window.onerror = function(msg, url, line, col, error) {
        console.error("Critical Error:", msg, error);
        const root = document.getElementById('root');
        if (root && root.innerHTML.trim() === "") {
          root.innerHTML = `<div style="padding: 40px; text-align: center; font-family: sans-serif; color: #1e293b; background: white; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <div style="font-size: 64px; margin-bottom: 24px;">⚠️</div>
            <h3 style="font-weight: 900; margin-bottom: 12px; font-size: 24px;">ব্যর্থতা (Startup Error)</h3>
            <p style="color: #64748b; font-size: 14px; margin-bottom: 24px; max-width: 300px;">${msg}<br/><small>Line: ${line}</small></p>
            <button onclick="location.reload()" style="padding: 14px 28px; background: #10b981; color: white; border: none; border-radius: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);">Retry Loading</button>
          </div>`;
        }
      };
    </script>

    <script>
      window.process = { env: { API_KEY: "" } };
    </script>

    <script>
      (function() {
        try {
          const settings = JSON.parse(localStorage.getItem('quran_settings'));
          if (settings && settings.isDarkMode) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Al-Quran">
    <meta id="theme-meta" name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-512.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              emerald: {
                50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 
                400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 
                800: '#065f46', 900: '#064e3b',
              },
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg-light: #f1f5f9; --bg-dark: #020617; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: var(--bg-light); transition: background-color 0.4s ease; }
        html.dark, html.dark body { background-color: var(--bg-dark); }
        body { font-family: 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; display: flex; justify-content: center; }
        #root { width: 100%; max-width: 1000px; height: 100dvh; display: flex; flex-direction: column; background-color: #f8fafc; position: relative; transition: background-color 0.4s ease; }
        .dark #root { background-color: var(--bg-dark); }
        @media (min-width: 1024px) {
            #root { height: 94dvh; margin-top: 3dvh; border-radius: 24px; border: 1px solid #e2e8f0; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); }
            .dark #root { border-color: #1e293b; }
        }
        .arabic-text { font-family: 'Amiri', serif; direction: rtl; }
        ::-webkit-scrollbar { display: none; }
        input, button { touch-action: manipulation; }
    </style>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.38.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    
    <!-- Babel standalone for handling .tsx files in the browser -->
    <script type="text/babel" data-presets="react,typescript" src="./index.tsx"></script>

    <script>
        if ('serviceWorker' in navigator && window.location.hostname !== 'localhost') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW failed:', err));
            });
        }
    </script>
</body>
</html>
